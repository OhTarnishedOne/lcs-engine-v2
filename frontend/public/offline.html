<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1628" />
    <title>Offline · LCS Engine</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A1628;
        color: #F9FAFB;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 22rem; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 16px; background: #1A2942;
        display: flex; align-items: center; justify-content: center;
      }
      .mark span { display: inline-block; width: 8px; margin: 0 2px; background: #00D4AA; border-radius: 3px; }
      .mark .b1 { height: 18px; } .mark .b2 { height: 28px; } .mark .b3 { height: 38px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #9CA3AF; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #00D4AA; color: #0A1628; border: 0;
        padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <span class="b1"></span><span class="b2"></span><span class="b3"></span>
      </div>
      <h1>You're offline</h1>
      <p>LCS Engine needs a connection to load this page. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
